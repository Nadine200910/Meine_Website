    <h1>Taschenrechner</h1>
    <div class="display">
        <div id="inputRechnung">
            <p id="inputRechnung"></p>
        </div>
        <div id="outputRechnung">
            <p id="outputRechnung"></p>
        </div>
        
    </div>
    <br>
    <div class="button1">
       
        <div class="buttonSize">
            <button type="button" id="zahl7">7</button>
        </div>
        <div class="buttonSize">
            <button type="button" id="zahl8">8</button>
        </div>
        <div class="buttonSize">
            <button type="button" id="zahl9">9</button>
        </div>
        <div class="buttonSize2">
            <button type="button" id="zeichenMal"> * </button>
        </div>
    
    
        
    </div>
   
    <div class="button1">
        <div class="buttonSize" >
            <button type="button" id="zahl4">4</button>
        </div>
        <div class="buttonSize" >
            <button type="button" id="zahl5">5</button>
        </div>
        <div class="buttonSize">
            <button type="button" id="zahl6">6</button>
        </div>
        <div class="buttonSize2" class="buttonC">
            <button type="button" id="zeichenGeteilt">/</button>
        </div>

    </div>
    <div class="button1">
        <div class="buttonSize">
            <button type="button" id="zahl1">1</button>
        </div>
        <div class="buttonSize">
            <button type="button" id="zahl2">2</button>
        </div>
        <div class="buttonSize">
            <button type="button" id="zahl3">3</button>
        </div>
        <div class="buttonSize">
            <button type="button" id="zeichenPlus">+</button>
        </div>
    </div>
    <div class="button1">
        <div class="buttonSize2">
            <button type="button" id="zeichenPunkt"> . </button>
        </div>
        <div class="buttonSize">
            <button type="button" id="zahl0">0</button>
        </div>
        <div class="buttonSize2">
            <button type="button" id="zeichenMinus"> - </button>
        </div>
        <div class="buttonSize">
            <button type="button" id="abgeben" onclick="abgeben()">=</button>
        </div>
        
        <div class="buttonSize2">
            <button type="button" id="clear">C</button>
        </div>
    </div>
